# Paypoq OS reverse proxy example (Nginx + TLS).
# Copy to server, adjust domains/certs, do not expose Postgres or API :3001 publicly.

# Rate-limit login surface at the edge (complements app-level limiter).
limit_req_zone $binary_remote_addr zone=paypoq_auth:10m rate=10r/m;

upstream paypoq_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

upstream paypoq_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

# --- Web (operators) ---
server {
  listen 443 ssl http2;
  server_name app.example.com;

  ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

  # Optional: Factory TV only on private network — comment out or IP-restrict /tv
  # location /tv {
  #   allow 10.0.0.0/8;
  #   allow 192.168.0.0/16;
  #   deny all;
  #   proxy_pass http://paypoq_web;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }

  # Platform admin — prefer VPN / IP allowlist
  # location /admin {
  #   allow 10.0.0.0/8;
  #   deny all;
  #   proxy_pass http://paypoq_web;
  #   ...
  # }

  location / {
    proxy_pass http://paypoq_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- API ---
server {
  listen 443 ssl http2;
  server_name api.example.com;

  ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

  client_max_body_size 5m;

  location = /health {
    proxy_pass http://paypoq_api/health;
    access_log off;
  }

  location = /health/readiness {
    proxy_pass http://paypoq_api/health/readiness;
    access_log off;
  }

  location /auth/login {
    limit_req zone=paypoq_auth burst=5 nodelay;
    proxy_pass http://paypoq_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /platform-auth/login {
    limit_req zone=paypoq_auth burst=5 nodelay;
    proxy_pass http://paypoq_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Telegram bot / internal only — bind on private interface or firewall
  # location /telegram/bot {
  #   allow 127.0.0.1;
  #   deny all;
  #   proxy_pass http://paypoq_api;
  # }

  location / {
    proxy_pass http://paypoq_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# HTTP → HTTPS
server {
  listen 80;
  server_name app.example.com api.example.com;
  return 301 https://$host$request_uri;
}
