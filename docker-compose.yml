# Paypoq OS — self-hosted runtime (SUPPORTED for local development and for a
# single-host pilot when the operator supplies real secrets and origins).
#
# Release contract (docs/RELEASE_RUNBOOK_V1.md): backup -> `--profile migrate`
# -> optional one-shot `--profile bootstrap` -> api -> readiness -> web -> bot
# -> smoke. The api service never migrates or seeds by itself.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paypoq_os}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-paypoq_os}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/paypoq_os?schema=public}
    command: ["pnpm", "--filter", "@paypoq/api", "prisma:migrate:deploy"]

  bootstrap:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    profiles: ["bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/paypoq_os?schema=public}
      # Passed through, not defaulted: the CLI itself refuses to run without
      # both values (compose interpolates every service, including inactive
      # profiles, so making these required here would break `up api web bot`).
      PLATFORM_BOOTSTRAP_EMAIL: ${PLATFORM_BOOTSTRAP_EMAIL:-}
      PLATFORM_BOOTSTRAP_PASSWORD: ${PLATFORM_BOOTSTRAP_PASSWORD:-}
    command: ["pnpm", "--filter", "@paypoq/api", "bootstrap:platform-admin"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      BUILD_SHA: ${BUILD_SHA:-unknown}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/paypoq_os?schema=public}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required (exact web origin, e.g. https://app.example.com)}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-paypoq_refresh_token}
      PLATFORM_JWT_ACCESS_SECRET: ${PLATFORM_JWT_ACCESS_SECRET:?PLATFORM_JWT_ACCESS_SECRET is required}
      PLATFORM_AUTH_COOKIE_NAME: ${PLATFORM_AUTH_COOKIE_NAME:-paypoq_platform_refresh_token}
      TELEGRAM_LINK_TOKEN_SECRET: ${TELEGRAM_LINK_TOKEN_SECRET:?TELEGRAM_LINK_TOKEN_SECRET is required}
      BOT_INTERNAL_API_KEY: ${BOT_INTERNAL_API_KEY:?BOT_INTERNAL_API_KEY is required}
      FACTORY_TV_ACCESS_TOKEN: ${FACTORY_TV_ACCESS_TOKEN:?FACTORY_TV_ACCESS_TOKEN is required}
      # Peers allowed to supply X-Forwarded-For (auth rate-limit identity):
      # the web/bot containers on this stack's network and the host reverse
      # proxy (arrives via the network gateway). Safe only while api/web are
      # published on 127.0.0.1 below — narrow this before exposing the API.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback,uniquelocal}
    ports:
      # Loopback only: clients reach the API through the host reverse proxy
      # (configs/nginx.paypoq.example.conf). A LAN/public binding would let a
      # client bypass the proxy and choose its rate-limit identity.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required at build time (baked into the browser bundle)}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Browser-facing API URL (baked at build) + server-side TV proxy config.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      FACTORY_TV_ACCESS_TOKEN: ${FACTORY_TV_ACCESS_TOKEN:?FACTORY_TV_ACCESS_TOKEN is required}
    ports:
      # Loopback only, for the same reason: the BFF trusts the client IP the
      # reverse proxy puts in X-Forwarded-For.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BOT_MODE: ${BOT_MODE:-polling}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      API_BASE_URL: ${API_BASE_URL:-http://api:3001}
      BOT_INTERNAL_API_KEY: ${BOT_INTERNAL_API_KEY:?BOT_INTERNAL_API_KEY is required}

volumes:
  postgres_data:
