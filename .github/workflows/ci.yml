name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-and-smoke:
    name: Build + API smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paypoq_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paypoq_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paypoq_os?schema=public
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_INTERNAL_URL: http://localhost:3001
      JWT_ACCESS_SECRET: local-ci-jwt-secret-change-me
      PLATFORM_JWT_ACCESS_SECRET: local-ci-platform-jwt-secret-change-me
      TELEGRAM_LINK_TOKEN_SECRET: local-ci-telegram-link-token-secret
      BOT_INTERNAL_API_KEY: local-ci-bot-internal-api-key-change-me
      FACTORY_TV_ACCESS_TOKEN: local-ci-factory-tv-token-change-me

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply migrations for smoke database
        run: pnpm prisma:migrate:deploy

      - name: API TypeScript
        run: pnpm --filter @paypoq/api typecheck

      - name: Web lint
        run: pnpm --filter @paypoq/web lint

      - name: Build API
        run: pnpm api:build

      - name: Build Web
        run: pnpm build

      - name: Build Bot
        run: pnpm bot:build

      - name: Static regression tests
        run: |
          pnpm --filter @paypoq/api test:prisma-error-mapping
          pnpm --filter @paypoq/api test:startup-schema-gate
          pnpm --filter @paypoq/api test:trusted-proxy
          pnpm --filter @paypoq/web test:pilot-scope
          pnpm --filter @paypoq/web test:guide-role
          pnpm --filter @paypoq/web test:stage-movement-quantity
          pnpm --filter @paypoq/web test:auth-proxy-path
          pnpm --filter @paypoq/web test:auth-proxy-forwarding
          pnpm test:factory-tv-secret
          pnpm test:notification-contract
          pnpm --filter @paypoq/bot test:shutdown

      - name: Mobile typecheck
        run: pnpm mobile:typecheck

      - name: Mobile lint
        run: pnpm mobile:lint

      - name: Validate Expo config
        run: pnpm --filter @paypoq/mobile exec expo config --type public

      - name: Verify Docker image builds
        run: |
          docker build -f apps/api/Dockerfile --build-arg BUILD_SHA="$GITHUB_SHA" -t paypoq-api:ci .
          docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 --build-arg BUILD_SHA="$GITHUB_SHA" -t paypoq-web:ci .
          docker build -f apps/bot/Dockerfile -t paypoq-bot:ci .

      - name: Web image build must fail without an explicit API origin
        run: |
          if docker build -f apps/web/Dockerfile -t paypoq-web:no-api-url . > /tmp/web-no-url.log 2>&1; then
            echo "ERROR: web image built without NEXT_PUBLIC_API_URL" >&2
            exit 1
          fi
          echo "Web image correctly refused to build without NEXT_PUBLIC_API_URL."

      - name: Run Telegram smoke suite
        run: pnpm smoke:telegram

      - name: Run MVP smoke suite
        run: pnpm smoke:mvp

      - name: Seed demo data for live API suites
        run: pnpm prisma:seed

      - name: Start API for live suites
        run: |
          node apps/api/dist/src/main.js > /tmp/paypoq-api.log 2>&1 &
          echo $! > /tmp/paypoq-api.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start" >&2
          cat /tmp/paypoq-api.log >&2 || true
          exit 1

      - name: Run RBAC role-access suite
        run: node apps/api/scripts/rbac-role-access-test.mjs

      - name: Run employee self-service smoke suite
        run: node apps/api/scripts/employee-self-service-smoke-test.mjs

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/paypoq-api.pid ]; then
            kill "$(cat /tmp/paypoq-api.pid)" || true
          fi

  production-hardening:
    name: Production hardening acceptance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paypoq_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paypoq_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paypoq_os?schema=public
      NODE_ENV: test
      # The suite creates and drops its own disposable databases through psql.
      HARDENING_PG_MODE: service
      PGHOST: localhost
      PG_PORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm api:build

      - name: Run production hardening acceptance
        run: node scripts/production-hardening-acceptance.mjs

  pilot-acceptance:
    name: Pilot browser acceptance (Chromium + WebKit)
    runs-on: ubuntu-latest
    # Heavier gate: full browser acceptance on PRs into main and on main itself.
    if: github.event_name == 'push' || github.base_ref == 'main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paypoq_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paypoq_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paypoq_os?schema=public
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_INTERNAL_URL: http://localhost:3001
      JWT_ACCESS_SECRET: local-ci-jwt-secret-change-me
      PLATFORM_JWT_ACCESS_SECRET: local-ci-platform-jwt-secret-change-me
      TELEGRAM_LINK_TOKEN_SECRET: local-ci-telegram-link-token-secret
      BOT_INTERNAL_API_KEY: local-ci-bot-internal-api-key-change-me
      FACTORY_TV_ACCESS_TOKEN: local-ci-factory-tv-token-change-me
      WEB_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (Chromium + WebKit)
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm prisma:migrate:deploy

      - name: Build API
        run: pnpm api:build

      - name: Build Web (production build, not dev server)
        run: pnpm build

      - name: Seed acceptance fixtures
        run: pnpm acceptance:seed

      - name: Start API
        run: |
          node apps/api/dist/src/main.js > /tmp/paypoq-api.log 2>&1 &
          echo $! > /tmp/paypoq-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/health/readiness >/dev/null; then echo "API ready"; exit 0; fi
            sleep 1
          done
          echo "API failed readiness" >&2; cat /tmp/paypoq-api.log >&2; exit 1

      - name: Start Web (standalone production server)
        run: |
          node apps/web/.next/standalone/apps/web/server.js > /tmp/paypoq-web.log 2>&1 &
          echo $! > /tmp/paypoq-web.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/login >/dev/null; then echo "Web ready"; exit 0; fi
            sleep 1
          done
          echo "Web failed to start" >&2; cat /tmp/paypoq-web.log >&2; exit 1

      - name: Business API/RBAC acceptance (Chromium + WebKit)
        run: node scripts/business-api-rbac-acceptance.mjs

      - name: Day-0 onboarding closure acceptance (Chromium + WebKit)
        run: node scripts/day0-onboarding-closure-acceptance.mjs

      - name: Hardened mobile UI acceptance (Chromium + WebKit)
        run: node scripts/mobile-ui-acceptance.mjs

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-acceptance-logs
          path: |
            /tmp/paypoq-api.log
            /tmp/paypoq-web.log
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          [ -f /tmp/paypoq-web.pid ] && kill "$(cat /tmp/paypoq-web.pid)" || true
          [ -f /tmp/paypoq-api.pid ] && kill "$(cat /tmp/paypoq-api.pid)" || true
